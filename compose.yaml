name: ivins-mav-dataset-server

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ivins-mav-dataset-server:3.2.0
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      IVINS_DATA_ROOT: /data
      IVINS_BAG_ROOT: /data/bags
      IVINS_MAX_UPLOAD_BYTES: ${IVINS_MAX_UPLOAD_BYTES:-53687091200}
      IVINS_MAX_JSON_BYTES: ${IVINS_MAX_JSON_BYTES:-65536}
      IVINS_REQUESTS_PER_MINUTE: ${IVINS_REQUESTS_PER_MINUTE:-120}
      IVINS_AUTH_ATTEMPTS_PER_MINUTE: ${IVINS_AUTH_ATTEMPTS_PER_MINUTE:-240}
      IVINS_AUTH_FAILURES_PER_MINUTE: ${IVINS_AUTH_FAILURES_PER_MINUTE:-20}
      IVINS_DOWNLOADS_PER_MINUTE: ${IVINS_DOWNLOADS_PER_MINUTE:-30}
      IVINS_PUBLIC_REQUESTS_PER_MINUTE: ${IVINS_PUBLIC_REQUESTS_PER_MINUTE:-120}
    ports:
      - "${IVINS_BIND_ADDRESS:-127.0.0.1}:${IVINS_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${IVINS_DATA_HOST_ROOT:-./var}
        target: /data
    mem_limit: ${IVINS_MEMORY_LIMIT:-1g}
    cpus: ${IVINS_CPU_LIMIT:-1.0}
    pids_limit: ${IVINS_PIDS_LIMIT:-128}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
