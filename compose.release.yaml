name: ${DSM_COMPOSE_PROJECT:-${IVINS_COMPOSE_PROJECT:-datasetsmanager-server}}

services:
  server:
    image: datasetsmanager-server:4.0.0
    pull_policy: never
    container_name: ${DSM_CONTAINER_NAME:-${IVINS_CONTAINER_NAME:-datasetsmanager-server}}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DSM_DATA_ROOT: /data
      DSM_BAG_ROOT: /data/bags
      DSM_MAX_UPLOAD_BYTES: ${DSM_MAX_UPLOAD_BYTES:-${IVINS_MAX_UPLOAD_BYTES:-53687091200}}
      DSM_MAX_JSON_BYTES: ${DSM_MAX_JSON_BYTES:-${IVINS_MAX_JSON_BYTES:-65536}}
      DSM_REQUESTS_PER_MINUTE: ${DSM_REQUESTS_PER_MINUTE:-${IVINS_REQUESTS_PER_MINUTE:-120}}
      DSM_AUTH_ATTEMPTS_PER_MINUTE: ${DSM_AUTH_ATTEMPTS_PER_MINUTE:-${IVINS_AUTH_ATTEMPTS_PER_MINUTE:-240}}
      DSM_AUTH_FAILURES_PER_MINUTE: ${DSM_AUTH_FAILURES_PER_MINUTE:-${IVINS_AUTH_FAILURES_PER_MINUTE:-20}}
      DSM_DOWNLOADS_PER_MINUTE: ${DSM_DOWNLOADS_PER_MINUTE:-${IVINS_DOWNLOADS_PER_MINUTE:-30}}
      DSM_PUBLIC_REQUESTS_PER_MINUTE: ${DSM_PUBLIC_REQUESTS_PER_MINUTE:-${IVINS_PUBLIC_REQUESTS_PER_MINUTE:-120}}
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${DSM_DATA_HOST_ROOT:-${IVINS_DATA_HOST_ROOT:-./var}}
        target: /data
    mem_limit: ${DSM_MEMORY_LIMIT:-${IVINS_MEMORY_LIMIT:-1g}}
    cpus: ${DSM_CPU_LIMIT:-${IVINS_CPU_LIMIT:-1.0}}
    pids_limit: ${DSM_PIDS_LIMIT:-${IVINS_PIDS_LIMIT:-128}}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    pull_policy: never
    container_name: ${DSM_CADDY_CONTAINER_NAME:-datasetsmanager-caddy}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      DSM_PUBLIC_HOST: ${DSM_PUBLIC_HOST:?set DSM_PUBLIC_HOST in .env}
    ports:
      - "${DSM_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${DSM_HTTP_PORT:-80}:80"
      - "${DSM_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${DSM_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    mem_limit: ${DSM_CADDY_MEMORY_LIMIT:-256m}
    cpus: ${DSM_CADDY_CPU_LIMIT:-0.50}
    pids_limit: ${DSM_CADDY_PIDS_LIMIT:-64}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
